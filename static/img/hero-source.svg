      <stop offset="0.35" stop-color="#d97f74"/>
      <stop offset="0.7" stop-color="#eda45f"/>
      <stop offset="1" stop-color="#f6c667"/>
    </linearGradient>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
