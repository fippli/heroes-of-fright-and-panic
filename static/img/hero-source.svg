    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9e6ff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#a8a4e0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a8a4e0" stop-opacity="0"/>
