<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/tree.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap"
      rel="stylesheet"
    />

    <title>forest-game</title>
  </head>
  <body>
    <div id="app">
      <div class="grid">
        <div class="menu">
          <div id="resources" class="resources-wrapper">
            <div class="resource-wrapper">
              <img src="/img/food.png" alt="food" class="resource-icon" />
              <div id="food"></div>
            </div>

            <div class="resource-wrapper">
              <img src="/img/wood.png" alt="wood" class="resource-icon" />
              <div id="wood"></div>
            </div>

            <div class="resource-wrapper">
              <img src="/img/stone.png" alt="stone" class="resource-icon" />
              <div id="stone"></div>
            </div>

            <div class="resource-wrapper">
              <img src="/img/gold.png" alt="gold" class="resource-icon" />

              <div id="gold"></div>
            </div>
          </div>

          <div id="buildings" class="buildings-wrapper">
            <div class="resource-wrapper">
              <img src="/img/house.png" alt="buildings" class="resource-icon" />
              <div id="houses"></div>
            </div>

            <div class="resource-wrapper">
              <img src="/img/tower.png" alt="buildings" class="resource-icon" />
              <div id="towers"></div>
            </div>

            <div class="resource-wrapper">
              <img
                src="/img/castle.png"
                alt="buildings"
                class="resource-icon"
              />
              <div id="castles"></div>
            </div>
          </div>

          <div class="resource-wrapper right-aligned">
            <img src="/img/clock.png" alt="time" class="resource-icon" />
            <div id="time"></div>
          </div>
        </div>

        <div class="canvas-wrapper">
          <div class="dialog-wrapper">
            <div class="dialog-content">
              <h1 id="dialog-title">Dialog</h1>
              <p id="dialog-text">This is a dialog</p>
              <button id="close-dialog">Close</button>
            </div>
          </div>

          <canvas id="canvas" width="600" height="600"></canvas>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
